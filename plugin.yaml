name: hermes-discord-plugin
version: 0.2.0
manifest_version: 2
api_version: 1
description: "Render Discord replies as embeds and add interactive cards to numbered cron offers."
author: rogafe
kind: standalone
platforms: [linux, macos, windows]
tags: [gateway, discord]

provides_hooks:
  - post_llm_call

# No extra Python dependencies: discord.py ships with Hermes' Discord adapter.
requires_env: []

config_schema:
  enabled:
    type: bool
    default: true
    label: "Render replies as embeds"
  footer_template:
    type: str
    default: "{model}"
    label: "Footer template"
    description: "Embed footer text. Placeholders: {model} (vendor prefix dropped), {model_full}."
  color:
    type: str
    default: "#5865F2"
    label: "Embed color"
    description: "Hex color of the embed's left bar, e.g. #5865F2."
  embed_non_model_replies:
    type: bool
    default: false
    label: "Embed non-model replies"
    description: "Also render final replies that no model produced (slash-command output, errors) as embeds, without a footer."
  cron_offer_interactions:
    type: bool
    default: true
    label: "Interactive cron offer cards"
    description: "Split numbered offers in Cronjob Response messages into embed cards with Ignore, Follow and Apply buttons."
  cron_offer_buttons:
    type: bool
    default: true
    label: "Cron offer action buttons"
    description: "Add buttons that send the selected offer action back to the current Hermes Discord conversation."
