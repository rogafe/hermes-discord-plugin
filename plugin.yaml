name: hermes-discord-plugin
version: 0.3.3
manifest_version: 2
api_version: 1
description: "Render Discord replies as embeds and add interactive cards to numbered cron offers."
author: rogafe
kind: standalone
platforms: [linux, macos, windows]
tags: [gateway, discord]

provides_hooks:
  - post_llm_call
  - pre_tool_call

# No extra Python dependencies: discord.py ships with Hermes' Discord adapter.
requires_env: []

config_schema:
  enabled:
    type: bool
    default: true
    label: "Render replies as embeds"
  render_mode:
    type: str
    default: "auto"
    label: "Reply rendering mode"
    description: "auto keeps fenced code/prompts as native copyable messages and embeds other replies; embed forces embeds; plain keeps all replies as native messages. Explicit reply overrides take precedence."
  footer_template:
    type: str
    default: "{model}"
    label: "Footer template"
    description: "Embed footer text. Placeholders: {model} (vendor prefix dropped), {model_full}."
  color:
    type: str
    default: "#5865F2"
    label: "Embed color"
    description: "Hex color of the embed's left bar, e.g. #5865F2."
  embed_non_model_replies:
    type: bool
    default: false
    label: "Embed non-model replies"
    description: "Also render final replies that no model produced (slash-command output, errors) as embeds, without a footer."
  long_reply_chunking:
    type: bool
    default: true
    label: "Clean chunking of long replies"
    description: "Split long final replies on paragraph, line, sentence and word boundaries (never inside code fences, links or bold/italic/code spans) before Hermes would cut them at 2000 characters."
  cron_offer_interactions:
    type: bool
    default: true
    label: "Interactive cron offer cards"
    description: "Split numbered offers in Cronjob Response messages into embed cards with Ignore, Follow and Apply buttons."
  cron_offer_buttons:
    type: bool
    default: true
    label: "Cron offer action buttons"
    description: "Add buttons that send the selected offer action back to the current Hermes Discord conversation."
  cron_offer_notes:
    type: bool
    default: true
    label: "Cron offer note modal"
    description: "Add a Remarque button to each offer card that opens a modal and forwards the typed note to Hermes alongside the offer."
  cron_pending_command:
    type: bool
    default: true
    label: "Cron pending slash command"
    description: "Register the /cron-pending slash command, which lists unclaimed offer cards in the current conversation. Registration happens once, so toggling needs a gateway restart."
  cron_recover_command:
    type: bool
    default: true
    label: "Cron recover slash command"
    description: "Register the /cron-recover slash command, which frees offer actions and notes interrupted by a gateway stop. The outcome of those deliveries is unknown, so the command warns about possible duplicates. Registration happens once, so toggling needs a gateway restart."
  cron_report_pagination:
    type: bool
    default: true
    label: "Paginate large cron reports"
    description: "Deliver big Cronjob Responses as page embeds with Previous/Next buttons instead of dozens of offer cards."
  cron_report_pagination_threshold:
    type: int
    default: 8
    label: "Pagination threshold (offers)"
    description: "Number of offers from which a cron report is paginated. 0 disables pagination."
